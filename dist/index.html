<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>CarryOkie</title>
    <link rel="stylesheet" crossorigin href="./assets/styles.css">
  </head>
  <body>
    <main class="shell landing-shell">
      <section class="app-hero card">
        <div class="hero-copy">
          <p class="eyebrow">Static karaoke room</p>
          <h1>CarryOkie</h1>
          <p>
            Start from the host screen. The host opens the TV Stage, casts that
            tab, and singers scan the TV QR to join.
          </p>
          <nav class="cards hero-actions" aria-label="CarryOkie pages">
            <a class="primary" href="host/">Start hosting</a>
            <a href="player/">I have a room code</a>
          </nav>
          <p class="hint">
            TV Stage links are generated from the host room so the QR always
            includes the right room code.
          </p>
        </div>
        <div class="stage-art" aria-hidden="true">
          <div class="stage-orb"></div>
          <div class="stage-mic"></div>
          <div class="soundwave">
            <span></span><span></span><span></span><span></span><span></span>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
